# PostgreSQL MCP — Query and inspect your database
#
# Setup:
#   1. Copy this file:
#      cp examples/mcp/postgres.yaml mcp_config.yaml
#   2. Replace the DATABASE_URL below with your connection string
#   3. Run:
#      studio --execute --env dev
#
# What agents can do:
#   - Run SELECT queries against your database
#   - Inspect table schemas and relationships
#   - Analyze data patterns and anomalies
#
# Safety: Only SELECT queries are allowed by default.
# The MCP server runs in read-only mode.
#
# Try:
#   "Show me the schema of all tables and how they relate"
#   "Find the top 10 customers by total order value"
#   "Analyze the orders table for any data quality issues"

servers:
  postgres:
    transport: stdio
    command: npx
    args: ["-y", "@modelcontextprotocol/server-postgres@0.6.2"]
    env:
      DATABASE_URL: "postgresql://user:password@localhost:5432/mydb"
    tool_risks:
      query: safe
      list_tables: safe
      describe_table: safe
      execute: dangerous
